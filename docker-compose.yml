#version: '3.9'
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: aether_invest
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]

  neo4j:
    image: neo4j:4.4.48
    container_name: neo4j
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/password
      #NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_dbms_memory_heap_initial_size: 2g
      NEO4J_dbms_memory_heap_max_size: 4g
      NEO4J_dbms_memory_pagecache_size: 2g
    volumes: 
    - neo4j_data:/data
    - ./import_csv:/import_csv
    - ./plugins:/plugins
    # restart: unless-stopped

  # milvus:
  #   image: milvusdb/milvus:v2.5.0
  #   ports: ["19530:19530"]
  #   volumes: ["milvus_data:/var/lib/milvus"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on: [mysql, neo4j, redis]
    environment:
      MYSQL_URI: mysql+aiomysql://user:password@mysql:3306/aether_invest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URI: redis://redis:6379/0
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://140.210.92.250:8001/v1}
    ports: ["8000:8000"]
    volumes:
      - ./.env:/app/.env:ro

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app.celery_app worker -l info
    depends_on: [redis, mysql, neo4j]
    environment:
      MYSQL_URI: mysql+aiomysql://user:password@mysql:3306/aether_invest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URI: redis://redis:6379/0
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://140.210.92.250:8001/v1}
    volumes:
      - ./.env:/app/.env:ro

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app.celery_app beat -l info
    depends_on: [redis, mysql, neo4j]
    environment:
      MYSQL_URI: mysql+aiomysql://user:password@mysql:3306/aether_invest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URI: redis://redis:6379/0
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://140.210.92.250:8001/v1}
    volumes:
      - ./.env:/app/.env:ro

  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [backend]
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["7860:7860"]

volumes:
  mysql_data:
  neo4j_data:
  # milvus_data: